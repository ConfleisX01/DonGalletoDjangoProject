{% extends 'panel.html' %}

{% block content %}
<header class="header mb-2">
    <span class="header-brand mb-0 h1">Editar la receta</span>
</header>
<div class="container w-75">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h1 class="card-title text-center">Editar Receta: {{ form.instance.nombre }}</h1>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <!-- Campo: Nombre -->
                <div class="mb-3">
                    <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre</label>
                    {{ form.nombre }}
                </div>

                <!-- Campo: Cantidad de galletas producidas -->
                <div class="mb-3">
                    <label for="{{ form.cantidad_galletas_producidas.id_for_label }}" class="form-label">Cantidad de galletas producidas</label>
                    {{ form.cantidad_galletas_producidas }}
                </div>

                <!-- Campo: Peso individual -->
                <div class="mb-3">
                    <label for="{{ form.peso_individual.id_for_label }}" class="form-label">Peso individual</label>
                    {{ form.peso_individual }}
                </div>

                <!-- Campo: Precio galleta -->
                <div class="mb-3">
                    <label for="{{ form.peso_individual.id_for_label }}" class="form-label">Precio de galleta (Unidades)</label>
                    {{ form.precio_galleta }}
                </div>

                <!-- Campo: Ingredientes -->
                <div class="mb-3">
                    <label for="{{ form.ingredientes.id_for_label }}" class="form-label">Ingredientes</label>
                    {{ form.ingredientes }}
                </div>

                <!-- Botones -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary me-md-2">
                        <i class="fas fa-save"></i> Guardar cambios
                    </button>
                    <a href="{% url 'lista_receta' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
