{% extends "main.html" %}

{% load static %}

{% block content %}
    <div class="container w-25 border rounded p-4 mt-5 shadow-sm">
        <div class="text-center mb-4">
            <h2 class="display-6 font-weight-bold">Confirmación del pedido</h2>
        </div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_fecha_recoleccion" class="form-label">Selecciona la fecha de recolección</label>
                {{ form.fecha_recoleccion }}
                <small class="text-secondary">*Todos los productos seran entregados en esta fecha</small>
                {% for error in form.fecha_recoleccion.errors %}
                    <div class="alert alert-danger mt-2">{{ error }}</div>
                {% endfor %}
            </div>
            <div class="d-flex justify-content-center mt-5">
                <button type="submit" class="btn btn-primary w-50">Confirmar Pedido</button>
            </div>
        </form>
    </div>
{% endblock content %}
