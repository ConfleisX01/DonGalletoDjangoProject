{% extends "main.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
          <h4 class="mb-0">Verificación en dos pasos</h4>
        </div>
        <div class="card-body">
          <form method="post" novalidate>
            {% csrf_token %}

            {% if form.non_field_errors %}
              <div class="alert alert-danger">
                {{ form.non_field_errors }}
              </div>
            {% endif %}

            <div class="mb-3">
              <label for="{{ form.token.id_for_label }}" class="form-label">
                Código del autenticador
              </label>
              <input type="text"
                     name="{{ form.token.name }}"
                     id="{{ form.token.id_for_label }}"
                     class="form-control"
                     placeholder="123 456"
                     autofocus>
              {% if form.token.errors %}
                <div class="text-danger small">{{ form.token.errors }}</div>
              {% endif %}
            </div>

            <button type="submit" class="btn btn-success w-100">Verificar</button>
          </form>

          <div class="mt-3 text-center">
            <a href="{% url 'two_factor:backup_tokens' %}" class="text-muted small">
              ¿No tienes acceso al autenticador?
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
