{% extends "panel.html" %}

{% load static %}

{% block content %}
<header class="header">
    <span class="header-brand" href="#">Lista de solicitudes</span>
    <ul class="header-nav">
      <li class="nav-item active">
        <a class="btn btn-outline-dark" href="{% url 'agregar_solicitud' %}">Crear nueva solicitud</a>
      </li>
    </ul>
</header>
<div class="p-4">
  <div class="row g-4">
    {% for item in solicitudes %}
      <div class="col-12 col-sm-6 col-xl-4 col-xxl-3">
        <div class="card rounded overflow-hidden">
          <div class="card-body p-0 d-flex align-items-center">
            <div class="bg-primary text-white py-4 px-4 me-3">
              <i class="bi bi-box2-fill fs-4"></i>
            </div>
            <div class="flex-grow-1">
              <div class="fs-5 fw-semibold">{{item.galleta.nombre}}</div>
              <div class="row row-cols-3 mt-2">
                <div class="text-uppercase fw-semibold small">${{item.galleta.precio_galleta}}</div>
                <div class="text-uppercase fw-semibold small">{{item.cantidad_solicitada}}pz</div>
                <span class="badge rounded-pill text-bg-secondary">{{item.estado}}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock content %}
