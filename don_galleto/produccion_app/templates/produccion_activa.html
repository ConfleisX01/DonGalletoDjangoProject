{% extends 'panel.html' %}

{% block content %}
<header class="header mb-2">
    <span class="header-brand mb-0 h1">Producción Activa</span>
    <a class="btn btn-primary" href="{% url 'crear_produccion' %}">Agregar Producción</a>
</header>
<div class="container-fluid">
    <table class="table">
        <thead>
            <tr>
              <th scope="col">Acciones</th>
              <th scope="col">#</th>
              <th scope="col">Nombre Producción</th>
              <th scope="col">Estado</th>
              <th scope="col">Fecha de Inicio</th>
            </tr>
        </thead>
        <tbody>
            {% for item in lista %}
                <tr class="align-middle">
                    <td>
                        <a class="btn btn-warning btn-sm" href="{% url 'editar_produccion' item.id %}">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                    <td>{{ item.id }}</td>
                    <td>{{ item.nombre_produccion }}</td>
                    <td>{{ item.estado }}</td>
                    <td>{{ item.fecha_inicio }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
